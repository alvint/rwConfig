# A compact tour of common HOCON features.
app {
  name = "Config Demo"
  version = 1.0
  enabled = true
  owner = null
}

// path expressions merge with the block above
app.description = "Uses HOCON, a superset of JSON"

server {
  host = localhost
  port = 8080
  port = ${?SERVER_PORT} # optional override from an env var; ignored if unset
  limits = [100, 250, 500]
  endpoints = [
    { path = "/health", methods = [GET] },
    { path = "/items", methods = [GET, POST] }
  ]
}

defaults {
  retries = 3
  timeout = 10 seconds # duration with units
}

worker = ${defaults} { # object concatenation/merge
  queue = jobs
}

labels {
  environment = development
  note = "unquoted and quoted strings both work"
}

message = """
  Multi-line strings
  keep their line breaks.
  """

hocon-foo {
  bar = 42
}

hocon-foo.bar = 42.5

"hocon-foo.bar" = 43
"hocon-foo\\bar" = 44

hocon."" = empty key
